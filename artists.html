<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artists | The Real Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,500..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div id="header"></div>
  <main class="page">
    <div class="directory-head">
      <div><p class="eyebrow">Performer directory</p><h1 class="display">Follow the act. Compare the trip.</h1><p class="intro">See how the cost of attending changes from one tour stop to the next.</p></div>
      <div class="directory-tools"><label><span class="eyebrow">Find a performer</span><input class="searchbox" id="artistSearch" type="search" placeholder="Try Olivia Rodrigo" autocomplete="off"></label><label class="check"><input id="touringOnly" type="checkbox"> Show performers in multiple cities</label></div>
    </div>
    <section class="artist-grid" id="artistGrid" aria-live="polite"></section>
  </main>
  <div id="footer"></div>
  <script src="site.js?v=3"></script>
  <script>
    document.getElementById("header").innerHTML = siteHeader("artists"); document.getElementById("footer").innerHTML = siteFooter();
    const grid = document.getElementById("artistGrid"), search = document.getElementById("artistSearch"), touring = document.getElementById("touringOnly");
    let ARTISTS = [];
    function render() {
      const query = search.value.trim().toLowerCase();
      const list = ARTISTS.filter(a => a.name.toLowerCase().includes(query) && (!touring.checked || a.cities.length > 1));
      grid.innerHTML = list.length ? list.map(a => `<a class="artist-card" href="artist.html?artist=${encodeURIComponent(a.name)}"><div><p class="eyebrow">${a.events.length} event${a.events.length === 1 ? "" : "s"}</p><h2>${a.name}</h2></div><div><p class="meta">${a.cities.join(" · ")}<br>Tickets from ${money(Math.min(...a.events.map(e => e.ticket)))}</p><span class="arrow" aria-hidden="true">→</span></div></a>`).join("") : `<p class="empty">No performers match that search.</p>`;
    }
    search.addEventListener("input", render); touring.addEventListener("change", render);
    loadEvents().then(events => {
      const groups = new Map(); events.forEach(event => { if (!groups.has(event.performer)) groups.set(event.performer, []); groups.get(event.performer).push(event); });
      ARTISTS = [...groups].map(([name, artistEvents]) => ({ name, events: artistEvents, cities: unique(artistEvents.map(e => e.city)) })).sort((a,b) => b.cities.length - a.cities.length || byName(a.name,b.name)); render();
    }).catch(error => showLoadError(grid, error));
  </script>
</body>
</html>
